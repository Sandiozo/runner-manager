name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Runner Manager version
      description: Shown in Settings → Updates.
      placeholder: "2.2.4"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options:
        - One PC
        - Several PCs (fleet)
  - type: textarea
    id: log
    attributes:
      label: Fleet agent log
      description: From the PC's ⋯ menu → View fleet agent log. Remove anything private before pasting.
      render: text
