name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/RunnerManager/RunnerManager.csproj -c Release

      - name: Test
        run: dotnet test tests/RunnerManager.Tests -c Release --logger "console;verbosity=normal"
