name: Recover RunnerWidget Laptop
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Diagnose laptop RunnerWidget
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $repo = 'C:\Users\skedn\Documents\GitHub\runner-widget'
          Write-Output '--- SOURCE HEAD ---'
          git -C $repo rev-parse HEAD
          Write-Output '--- CANONICAL COPIES ---'
          Get-ChildItem (Join-Path $repo 'bin') -Filter RunnerWidget.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          Write-Output '--- RUNNERWIDGET PROCESS ---'
          Get-CimInstance Win32_Process -Filter "Name='RunnerWidget.exe'" | Select-Object ProcessId,ParentProcessId,CommandLine,ExecutablePath | Format-List
          Write-Output '--- RDC PROCESSES ---'
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'desktop-commander|rdc-launch' } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List
          Write-Output '--- RDC LAUNCHER ---'
          Get-Content 'C:\Users\skedn\AppData\Local\RunnerWidget\rdc-launch.ps1' -ErrorAction SilentlyContinue
          Write-Output '--- RDC RUNTIME LOG ---'
          Get-Content 'C:\Users\skedn\AppData\Local\RunnerWidget\rdc-runtime.log' -Tail 80 -ErrorAction SilentlyContinue
          Write-Output '--- AGENT LOG ---'
          Get-Content 'C:\Users\skedn\AppData\Local\RunnerWidget\agent.log' -Tail 80 -ErrorAction SilentlyContinue
