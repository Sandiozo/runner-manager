name: Release

# Push a tag like v2.2.0 (or run this workflow manually with a version) to publish RunnerManager.exe.
# Runner Manager installs and updates itself from these releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.1.0'
        required: true

permissions:
  contents: write

# One release at a time; a second run waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $raw = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME }
          $version = $raw.Trim().TrimStart('v', 'V')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$raw' must look like 2.1.0" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/RunnerManager.Tests -c Release

      - name: Publish single-file exe
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet publish src/RunnerManager/RunnerManager.csproj -c Release -r win-x64 -p:SelfContained=false
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=$env:VERSION -o publish

      - name: Publish standalone exe (includes .NET)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet publish src/RunnerManager/RunnerManager.csproj -c Release -r win-x64 -p:SelfContained=true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -p:Version=$env:VERSION -o publish-standalone

      - name: Smoke-test both exes
        shell: pwsh
        run: |
          # --probe starts the app and exits right away; a non-zero exit code means the build cannot start.
          foreach ($exe in 'publish/RunnerManager.exe', 'publish-standalone/RunnerManager.exe') {
            $p = Start-Process $exe -ArgumentList '--probe' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$exe --probe exited with code $($p.ExitCode)." }
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          # One single-file exe under two names: RunnerManagerSetup.exe opens the setup wizard, RunnerManager.exe is what
          # installed copies update to. There is deliberately no RunnerWidget.exe: agents from 2.1 and earlier cannot check
          # for the .NET runtime first, so they keep their version until setup runs on that PC.
          # The standalone setup includes .NET, for PCs without the .NET 10 Desktop Runtime. Updates always use
          # RunnerManager.exe and install the runtime when it is missing.
          Copy-Item publish/RunnerManager.exe publish/RunnerManagerSetup.exe
          Copy-Item publish-standalone/RunnerManager.exe publish/RunnerManagerSetup-standalone.exe
          function Hash($file) { (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() }

          # The release notes take this version's section of CHANGELOG.md.
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($env:VERSION))\s*\r?\n(.*?)(?=^## |\z)")
          $changes = if ($section.Success) { $section.Groups[1].Value.Trim() } else { 'See CHANGELOG.md.' }

          $notes = @(
            '## Download', '',
            '| File | Use it for |', '| --- | --- |',
            '| **RunnerManagerSetup-standalone.exe** | New installs. Includes .NET; choose this one if you are not sure. |',
            '| **RunnerManagerSetup.exe** | New installs on PCs that have the .NET 10 Desktop Runtime. |',
            '| RunnerManager.exe | Used by updates. You do not need to download it. |', '',
            'Existing installs update from Settings or the PC card. From 2.1 or earlier, run the setup once on each PC.',
            'The setup is not code-signed: if Windows shows "Windows protected your PC", click **More info → Run anyway**.', '',
            '## Changes', '', $changes, '',
            '## SHA-256', '',
            "- RunnerManagerSetup-standalone.exe: ``$(Hash publish/RunnerManagerSetup-standalone.exe)``",
            "- RunnerManagerSetup.exe and RunnerManager.exe: ``$(Hash publish/RunnerManager.exe)``"
          ) -join "`n"
          gh release create $tag publish/RunnerManagerSetup-standalone.exe publish/RunnerManagerSetup.exe publish/RunnerManager.exe `
            --title "Runner Manager $tag" --notes $notes --target $env:GITHUB_SHA
