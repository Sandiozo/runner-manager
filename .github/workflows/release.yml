name: Release

# Push a tag like v2.2.0 (or run this workflow manually with a version) to publish RunnerManager.exe.
# Runner Manager installs and updates itself from these releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 2.1.0'
        required: true

permissions:
  contents: write

# One release at a time; a second run waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $raw = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME }
          $version = $raw.Trim().TrimStart('v', 'V')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$raw' must look like 2.1.0" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/RunnerManager.Tests -c Release

      - name: Publish single-file exe
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet publish src/RunnerManager/RunnerManager.csproj -c Release -r win-x64 -p:SelfContained=false
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=$env:VERSION -o publish

      - name: Smoke-test the exe
        shell: pwsh
        run: |
          # --probe starts the app and exits right away; a non-zero exit code means the build cannot start.
          $p = Start-Process publish/RunnerManager.exe -ArgumentList '--probe' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "RunnerManager.exe --probe exited with code $($p.ExitCode)." }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:VERSION"
          # One single-file exe under two names: RunnerManagerSetup.exe opens the setup wizard, RunnerManager.exe is what
          # installed copies update to. There is deliberately no RunnerWidget.exe: agents from 2.1 and earlier cannot check
          # for the .NET runtime first, so they keep their version until setup runs on that PC.
          Copy-Item publish/RunnerManager.exe publish/RunnerManagerSetup.exe
          $hash = (Get-FileHash publish/RunnerManager.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = "Runner Manager $tag`n`n**New install:** download and run RunnerManagerSetup.exe.`nExisting installs update from Settings or the PC card. From 2.1 or earlier, run the setup once on each PC.`n`nSHA-256 of the exe: ``$hash```nRequires the .NET 10 Desktop Runtime. Updates install it automatically when it is missing."
          gh release create $tag publish/RunnerManagerSetup.exe publish/RunnerManager.exe --title "Runner Manager $tag" --notes $notes --generate-notes --target $env:GITHUB_SHA
